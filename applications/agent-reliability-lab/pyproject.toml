[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-reliability-lab"
version = "0.1.0"
description = "An experimental reliability-testing application built on Solari"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "solari-browser>=0.1.2",
  "fastapi>=0.118,<1",
  "uvicorn[standard]>=0.30,<1",
  "jinja2>=3.1,<4",
  "python-dotenv>=1.0,<2",
  "langgraph>=1.0,<2",
  "langchain-core>=1.0,<2",
  "langchain-google-genai>=4.1,<5",
]

[project.scripts]
agent-reliability-lab = "app.server:main"

[tool.setuptools]
packages = ["app"]

[tool.setuptools.package-data]
app = ["templates/*", "static/*"]
